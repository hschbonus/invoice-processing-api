services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoice_processing
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice_processing
      STORAGE_DIR: /data/documents
      MAX_UPLOAD_BYTES: 5242880
      PROCESSING_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - document_data:/data/documents
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice_processing
      STORAGE_DIR: /data/documents
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_data:/data/documents

volumes:
  postgres_data:
  redis_data:
  document_data:
