name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoice_processing
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_processing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://invoice:invoice@localhost:5432/invoice_processing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest

      - name: Apply PostgreSQL migrations
        run: poetry run alembic upgrade head

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the complete stack
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Verify asynchronous invoice processing
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --form "file=@samples/ubl/valid-invoice.xml;type=application/xml" \
            http://127.0.0.1:8000/v1/documents)
          job_id=$(jq --raw-output '.job_id' <<< "$response")

          for attempt in {1..30}; do
            result=$(curl --fail --silent --show-error \
              "http://127.0.0.1:8000/v1/jobs/$job_id")
            job_status=$(jq --raw-output '.status' <<< "$result")
            if [[ "$job_status" == "succeeded" ]]; then
              jq --exit-status '.result.validation_status == "valid"' <<< "$result"
              exit 0
            fi
            if [[ "$job_status" == "failed" ]]; then
              echo "$result"
              exit 1
            fi
            sleep 1
          done

          echo "Processing job did not complete before the timeout."
          docker compose logs api worker redis db
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
